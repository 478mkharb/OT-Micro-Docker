services:
  prometheus:
    image: prom/prometheus:v3.6.0
    container_name: prometheus
    restart: unless-stopped

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

    networks:
      - default

  grafana:
    image: grafana/grafana:12.2.0
    container_name: grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    ports:
      - "3001:3000"

    volumes:
      # Persistent Grafana data
      - grafana-data:/var/lib/grafana

      # Provisioning configuration
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

      # Dashboard JSON files
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    networks:
      - default

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped

    command:
      - --config.file=/etc/alertmanager/alertmanager.yml

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

    networks:
      - default

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped

    command:
      - --path.rootfs=/host

    ports:
      - "9100:9100"

    volumes:
      - /:/host:ro,rslave

    networks:
      - default

  loki:
    image: grafana/loki:3.5.4
    container_name: loki
    restart: unless-stopped

    command:
      - -config.file=/etc/loki/config.yml

    ports:
      - "3100:3100"

    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

    networks:
      - default

  promtail:
    image: grafana/promtail:3.5.4
    container_name: promtail
    restart: unless-stopped

    command:
      - -config.file=/etc/promtail/config.yml

    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - default

    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.8.2
    container_name: tempo
    restart: unless-stopped

    command:
      - -config.file=/etc/tempo/config.yml

    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"

    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/tmp/tempo

    networks:
      - default

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.133.0
    container_name: otel-collector
    restart: unless-stopped

    command:
      - --config=/etc/otelcol/config.yml

    volumes:
      - ./otel-collector/config.yml:/etc/otelcol/config.yml:ro

    depends_on:
      - tempo

    networks:
      - default

  beyla:
    image: grafana/beyla:2.5.7
    container_name: beyla
    privileged: true
    pid: host
    restart: unless-stopped

    command:
      - -config=/etc/beyla/config.yml

    volumes:
      - ./beyla/config.yml:/etc/beyla/config.yml:ro
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - otel-collector

    networks:
      - default

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  default:
    external: true
    name: otms-network

  