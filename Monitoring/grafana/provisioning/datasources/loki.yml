apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    version: 2
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]+)"'
          name: TraceID
          url: '$${__value.raw}'