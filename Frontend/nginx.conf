server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ==================================================
    # React Frontend
    # ==================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================================================
    # Employee API
    # ==================================================
    location /api/v1/employee/ {
        proxy_pass http://employee-api:8080/api/v1/employee/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================================
    # Attendance API
    # ==================================================
    location /api/v1/attendance/ {
        proxy_pass http://attendance-api:8081/api/v1/attendance/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================================
    # Salary API
    # ==================================================
    location /api/v1/salary/ {
        proxy_pass http://salary-api:8082/api/v1/salary/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================================
    # Notification API
    # ==================================================
    location /api/v1/notification/ {
        proxy_pass http://notification-api:8085/api/v1/notification/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==================================================
    # Spring Boot Actuator
    # ==================================================
    location /actuator/ {
        proxy_pass http://salary-api:8082/actuator/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ==================================================
    # Employee Swagger
    # ==================================================
    location /swagger/ {
        proxy_pass http://employee-api:8080/swagger/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    client_max_body_size 20M;
}