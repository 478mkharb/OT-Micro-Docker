spring:
  cassandra:
    keyspace-name: employee_db
    contact-points: scylladb.otms.internal
    port: 9042
    local-datacenter: datacenter1

  data:
    redis:
      host: redis.otms.internal
      port: 6379
      password: ""

server:
  port: 8082

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: [ "health", "prometheus", "metrics" ]

  health:
    cassandra:
      enabled: true

  endpoint:
    health:
      show-details: always

    metrics:
      enabled: true

    prometheus:
      enabled: true

logging:
  level:
    org.springframework.web: DEBUG

springdoc:
  swagger-ui:
    path: /salary-documentation
    tryItOutEnabled: true
    filter: true

  api-docs:
    path: /salary-api-docs

  show-actuator: true
