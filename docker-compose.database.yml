networks:
  otms-network:
    name: otms-network
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  scylladb-data:
  elasticsearch-data:

services:

  scylladb:
    image: 478mkharb/otms-scylladb:latest
    container_name: scylladb

    command:
      - --smp
      - "1"
      - --memory
      - 512M
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"

    ports:
      - "9042:9042"

    volumes:
      - scylladb-data:/var/lib/scylla

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cqlsh $(hostname -i) 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1 || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
  
  postgres:
    image: 478mkharb/otms-postgres:latest
    container_name: postgres

    environment:
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    shm_size: 128m

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d attendance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: 478mkharb/otms-redis:latest
    container_name: redis

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: 478mkharb/otms-elasticsearch:latest
    container_name: elasticsearch

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"

    ports:
      - "9200:9200"
      - "9300:9300"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: postgres-exporter

    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:password@postgres:5432/attendance_db?sslmode=disable"

    ports:
      - "9187:9187"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    container_name: redis-exporter

    environment:
      REDIS_ADDR: redis://redis:6379

    ports:
      - "9121:9121"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
    container_name: elasticsearch-exporter

    command:
      - --es.uri=http://elasticsearch:9200

    ports:
      - "9114:9114"

    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped
