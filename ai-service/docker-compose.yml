services:

  ollama:
    image: ollama/ollama:latest

    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - otms-network

    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-service

    ports:
      - "8001:8000"

    env_file:
      - .env

    environment:
      SERVICE_NAME: ai-observability-service

    depends_on:
      - ollama

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  otms-network:
    external: true

volumes:
  ollama-data: