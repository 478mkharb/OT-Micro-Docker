services:

  scylla-init:
    image: 478mkharb/otms-scylla-init:latest

    container_name: scylla-init

    depends_on:
      scylladb:
        condition: service_healthy

    networks:
      - otms-network

    restart: "no"
  
  scylla-migration:
    image: 478mkharb/otms-scylla-migration:latest

    container_name: scylla-migration

    environment:
      SCYLLA_HOST: scylladb
      SCYLLA_PORT: 9042
      SCYLLA_USERNAME: scylladb
      SCYLLA_PASSWORD: password
      SCYLLA_KEYSPACE: employee_db

    depends_on:
      scylla-init:
        condition: service_completed_successfully

    networks:
      - otms-network

    restart: "no"

  attendance-migration:
    image: 478mkharb/otms-attendance-migration:latest

    container_name: attendance-migration

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - otms-network

    restart: "no"

  employee-api:
    image: 478mkharb/otms-employee-api:latest

    container_name: employee-api

    ports:
      - "8080:8080"

    environment:
      SCYLLA_HOST: scylladb
      SCYLLA_PORT: 9042
      SCYLLA_USERNAME: scylladb
      SCYLLA_PASSWORD: password
      SCYLLA_KEYSPACE: employee_db

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      GIN_MODE: release

      # OpenTelemetry
      OTEL_SERVICE_NAME: employee-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

    depends_on:
      scylla-migration:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/employee/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  salary-api:
    image: 478mkharb/otms-salary-api:latest

    container_name: salary-api

    ports:
      - "8082:8082"

    environment:
      SCYLLA_HOST: scylladb
      SCYLLA_PORT: 9042
      SCYLLA_USERNAME: scylladb
      SCYLLA_PASSWORD: password
      SCYLLA_KEYSPACE: employee_db

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      SPRING_PROFILES_ACTIVE: docker
      # OpenTelemetry

      OTEL_SERVICE_NAME: salary-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_RESOURCE_ATTRIBUTES: service.name=salary-api

      OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: "true"

    depends_on:
      scylla-migration:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  attendance-api:
    image: 478mkharb/otms-attendance-api:latest

    container_name: attendance-api

    ports:
      - "8081:8081"

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: attendance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      SERVER_PORT: 8081
      # OpenTelemetry
      OTEL_SERVICE_NAME: attendance-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

    depends_on:
      attendance-migration:
        condition: service_completed_successfully

      redis:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/attendance/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  notification-api:
    image: 478mkharb/otms-notification-api:latest

    container_name: notification-api

    ports:
      - "8085:8085"

    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8085

      SMTP_FROM: jenkinsotms@gmail.com
      SMTP_USERNAME: jenkinsotms@gmail.com
      SMTP_PASSWORD: zvdftllukvincrgj
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 587

      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200
      ELASTIC_USERNAME: ""
      ELASTIC_PASSWORD: ""
      ELASTIC_INDEX: employee_index
      # OpenTelemetry
      OTEL_SERVICE_NAME: notification-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

    depends_on:
      elasticsearch:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/api/v1/notification/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  scylla-sync:
    image: 478mkharb/otms-scylla-sync:latest

    container_name: scylla-sync

    environment:
      SCYLLA_HOST: scylladb
      SCYLLA_PORT: 9042
      SCYLLA_USERNAME: scylladb
      SCYLLA_PASSWORD: password
      SCYLLA_KEYSPACE: employee_db

      ES_HOST: http://elasticsearch:9200
      ES_INDEX: employee_index

      NOTIFICATION_URL: http://notification-api:8085/api/v1/notification/send/all

      SYNC_INTERVAL: 5

    depends_on:
      scylladb:
        condition: service_started

      elasticsearch:
        condition: service_healthy

      notification-api:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped

  frontend:
    image: 478mkharb/otms-frontend:latest

    container_name: frontend

    ports:
      - "3000:80"

    depends_on:
      employee-api:
        condition: service_healthy
      salary-api:
        condition: service_healthy
      attendance-api:
        condition: service_healthy
      notification-api:
        condition: service_healthy

    networks:
      - otms-network

    restart: unless-stopped

networks:
  otms-network:
    driver: bridge
